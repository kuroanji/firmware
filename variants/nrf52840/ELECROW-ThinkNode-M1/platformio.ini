; First prototype eink/nrf52840/sx1262 device
[env:thinknode_m1]
custom_meshtastic_hw_model = 89
custom_meshtastic_hw_model_slug = THINKNODE_M1
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = ThinkNode M1
custom_meshtastic_images = thinknode_m1.svg
custom_meshtastic_tags = Elecrow
custom_meshtastic_has_ink_hud = true

extends = nrf52840_base
board = ThinkNode-M1
board_check = true
debug_tool = jlink

# add -DCFG_SYSVIEW if you want to use the Segger systemview tool for OS profiling.
build_flags = ${nrf52840_base.build_flags}
  -Ivariants/nrf52840/ELECROW-ThinkNode-M1
  -DELECROW_ThinkNode_M1
  -DUSE_EINK
  -DEINK_DISPLAY_MODEL=GxEPD2_154_D67
  -DEINK_WIDTH=200
  -DEINK_HEIGHT=200
  -DUSE_EINK_DYNAMICDISPLAY            ; Enable Dynamic EInk
  -DEINK_LIMIT_FASTREFRESH=10          ; How many consecutive fast-refreshes are permitted    //20
  -DEINK_LIMIT_RATE_BACKGROUND_SEC=10  ; Minimum interval between BACKGROUND updates          //30
  -DEINK_LIMIT_RATE_RESPONSIVE_SEC=1   ; Minimum interval between RESPONSIVE updates
;   -DEINK_LIMIT_GHOSTING_PX=2000        ; (Optional) How much image ghosting is tolerated
  -DEINK_BACKGROUND_USES_FAST          ; (Optional) Use FAST refresh for both BACKGROUND and RESPONSIVE, until a limit is reached.

build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/ELECROW-ThinkNode-M1>
lib_deps = 
  ${nrf52840_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-GxEPD2 packageName=https://github.com/meshtastic/GxEPD2 gitBranch=master
  https://github.com/meshtastic/GxEPD2/archive/c7eb4c3c167cf396ef4f541cc5d4c6aa42f3c46b.zip
  # renovate: datasource=custom.pio depName=nRF52_PWM packageName=khoih-prog/library/nRF52_PWM
  khoih-prog/nRF52_PWM@1.0.1
;upload_protocol = fs

; ---------------------------------------------------------------------------
; InkHUD2 build (our fork): new UI architecture + auto-backup/restore core
; Panel is GDEY0154D67 1.54" 200x200 — identical to T-Echo, so InkHUD2 layout
; works unmodified. Backlight on PIN_EINK_EN, two PHYSICAL buttons.
; ---------------------------------------------------------------------------
[env:thinknode_m1-inkhud2]
; NOTE: nrf52_base (not nrf52840_base) — the latter drags in environmental_base +
; environmental_extra (BME/BMP/DPS/Bosch/GFX/SSD1306 drivers). The M1 has NO onboard
; environmental sensors (bare I2C bus only), so that pile is dead weight: it cost
; ~10% of flash. Same base as our other nRF InkHUD2 targets (t-echo, mesh-pocket).
extends = nrf52_base, inkhud
board = ThinkNode-M1
board_check = true
debug_tool = jlink
custom_meshtastic_hw_model = 89
custom_meshtastic_hw_model_slug = THINKNODE_M1
custom_meshtastic_architecture = nrf52840
custom_meshtastic_display_name = ThinkNode M1
custom_meshtastic_variant = InkHUD2
custom_meshtastic_tags = Elecrow
build_flags =
  ${nrf52_base.build_flags}
  ${inkhud.build_flags}
  -DSERIAL_BUFFER_SIZE=4096
  -DLED_BUILTIN=-1
  -DUSE_INKHUD2
  -I variants/nrf52840/ELECROW-ThinkNode-M1
  -D ELECROW_ThinkNode_M1
build_src_filter =
  ${nrf52_base.build_src_filter}
  ${inkhud.build_src_filter}
  +<../variants/nrf52840/ELECROW-ThinkNode-M1>
lib_deps =
  ${inkhud.lib_deps} ; InkHUD libs first, so we get GFXRoot instead of AdafruitGFX
  ${nrf52_base.lib_deps}
  ; nRF52840-specific crypto (comes from nrf52840_base normally; we extend nrf52_base)
  https://github.com/Kongduino/Adafruit_nRFCrypto/archive/8cde7189b5ead9dcd49f72601b43b969c0bbc06e.zip
  # renovate: datasource=custom.pio depName=nRF52_PWM packageName=khoih-prog/library/nRF52_PWM
  khoih-prog/nRF52_PWM@1.0.1
; nrf52840_base pulls environmental_base, which drags in Adafruit GFX + SSD1306/SH110X.
; InkHUD2 uses GFXRoot instead, so those must be ignored (same as our ESP32-S3 InkHUD2 envs).
lib_ignore =
  Adafruit GFX Library
  Adafruit SSD1306
  Adafruit SH110X
  GxEPD2

[env:thinknode_m1-inkhud]
extends = nrf52840_base, inkhud
board = ThinkNode-M1
board_check = true
debug_tool = jlink
build_flags = 
  ${nrf52840_base.build_flags}
  ${inkhud.build_flags}
  -I variants/nrf52840/ELECROW-ThinkNode-M1
  -D ELECROW_ThinkNode_M1
build_src_filter = 
  ${nrf52_base.build_src_filter} 
  ${inkhud.build_src_filter}
  +<../variants/nrf52840/ELECROW-ThinkNode-M1>
lib_deps = 
  ${inkhud.lib_deps} ; InkHUD libs first, so we get GFXRoot instead of AdafruitGFX
  ${nrf52840_base.lib_deps}
