; Using original screen class
[env:t-echo]
custom_meshtastic_hw_model = 7
custom_meshtastic_hw_model_slug = T_ECHO
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = LILYGO T-Echo
custom_meshtastic_images = t-echo.svg
custom_meshtastic_tags = LilyGo

extends = nrf52840_base
board = t-echo
board_level = pr
board_check = true
debug_tool = jlink

# add -DCFG_SYSVIEW if you want to use the Segger systemview tool for OS profiling.
build_flags = ${nrf52840_base.build_flags}
  -Ivariants/nrf52840/t-echo
  -DEINK_DISPLAY_MODEL=GxEPD2_154_D67
  -DEINK_WIDTH=200
  -DEINK_HEIGHT=200
  -DUSE_EINK
  -DUSE_EINK_DYNAMICDISPLAY            ; Enable Dynamic EInk
  -DEINK_LIMIT_FASTREFRESH=20          ; How many consecutive fast-refreshes are permitted
  -DEINK_BACKGROUND_USES_FAST          ; (Optional) Use FAST refresh for both BACKGROUND and RESPONSIVE, until a limit is reached.

build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/t-echo>
lib_deps = 
  ${nrf52840_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-GxEPD2 packageName=https://github.com/meshtastic/GxEPD2 gitBranch=master
  https://github.com/meshtastic/GxEPD2/archive/a05c11c02862624266b61599b0d6ba93e33c6f24.zip
  # renovate: datasource=custom.pio depName=SensorLib packageName=lewisxhe/library/SensorLib
  lewisxhe/SensorLib@0.3.4
;upload_protocol = fs

[env:t-echo-inkhud]
extends = nrf52840_base, inkhud
board = t-echo
board_level = pr
board_check = true
debug_tool = jlink
build_flags = 
  ${nrf52840_base.build_flags}
  ${inkhud.build_flags}
  -I variants/nrf52840/t-echo
build_src_filter = 
  ${nrf52_base.build_src_filter} 
  ${inkhud.build_src_filter}
  +<../variants/nrf52840/t-echo>
lib_deps =
  ${inkhud.lib_deps} ; InkHUD libs first, so we get GFXRoot instead of AdafruitGFX
  ${nrf52840_base.lib_deps}
  # renovate: datasource=custom.pio depName=SensorLib packageName=lewisxhe/library/SensorLib
  lewisxhe/SensorLib@0.3.4

; InkHUD2 - New experimental graphics architecture
; Display: 200x200 (same as T-Echo Plus)
; Touch button for backlight control
; Uses nrf52_base (not nrf52840_base) to skip environmental sensors (~130KB savings)
; RTC disabled via variant.h check (time comes from GPS)
[env:t-echo-inkhud2]
extends = nrf52_base, inkhud
board = t-echo
board_level = pr
board_check = true
debug_tool = jlink
build_flags =
  ${nrf52_base.build_flags}
  ${inkhud.build_flags}
  -DSERIAL_BUFFER_SIZE=4096
  -DLED_BUILTIN=-1
  -I variants/nrf52840/t-echo
  -D USE_INKHUD2
build_src_filter =
  ${nrf52_base.build_src_filter}
  ${inkhud.build_src_filter}
  +<../variants/nrf52840/t-echo>
lib_deps =
  ${inkhud.lib_deps}
  ${nrf52_base.lib_deps}
  ; nRF52840 specific
  https://github.com/Kongduino/Adafruit_nRFCrypto/archive/8cde7189b5ead9dcd49f72601b43b969c0bbc06e.zip
  ; RTC chip (PCF8563) support
  lewisxhe/SensorLib@0.3.4
  ; Optional environmental sensor (some T-Echo units have BME280 soldered)
  adafruit/Adafruit BME280 Library@2.3.0
lib_ignore =
  Adafruit GFX Library
  GxEPD2
